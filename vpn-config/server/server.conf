# Конфигурация OpenVPN сервера с поддержкой bee2evp
# Этот файл определяет поведение OpenVPN сервера и настройки VPN сети

# Режим работы
# Указывает, что это серверное приложение (принимает подключения от клиентов)
mode server
# Использует TLS для аутентификации (сервер должен предоставить сертификат)
tls-server

# Локальный адрес и порт
# IP адрес для прослушивания (0.0.0.0 означает все интерфейсы)
# Раскомментируйте и укажите конкретный IP для привязки к одному интерфейсу
# local 0.0.0.0
# Порт для приема подключений (стандартный порт OpenVPN)
# В продакшене можно изменить на нестандартный для безопасности
port 1194
# Протокол передачи данных (UDP быстрее, TCP надежнее)
# Для продакшена можно использовать TCP (proto tcp) для большей надежности через NAT
proto udp

# TUN интерфейс
# Имя виртуального сетевого интерфейса для VPN туннеля
# Можно оставить автоматическое имя (dev tun) или указать конкретное
dev tun0
# Топология сети: subnet означает, что клиенты получают IP из подсети сервера
# Альтернатива: net30 (устаревший) или p2p (point-to-point)
topology subnet

# Сеть VPN
# Определяет подсеть для VPN (первый IP - сервер, остальные - клиенты)
# Формат: server <сеть> <маска>
# В продакшене выберите подсеть, не конфликтующую с локальными сетями
server 10.8.0.0 255.255.255.0

# Ключи и сертификаты
# Путь к сертификату центра сертификации (CA)
# Используется для проверки подлинности клиентов
ca /etc/openvpn/ca/ca.crt
# Сертификат сервера для аутентификации перед клиентами
cert /etc/openvpn/keys/server.crt
# Приватный ключ сервера (должен храниться в секрете)
key /etc/openvpn/keys/server.key
# Параметры Диффи-Хеллмана для обмена ключами
# Должен быть сгенерирован с достаточной длиной (2048+ бит для безопасности)
dh /etc/openvpn/keys/dh.pem
# TLS ключ для дополнительной защиты (опционально, раскомментируйте при использовании)
# tls-auth /etc/openvpn/keys/ta.key 0

# Криптография (используем bee2evp через OpenSSL)
# Алгоритм шифрования данных в туннеле
# AES-256-CBC - стандартный, но можно использовать алгоритмы bee2evp (belt-*)
cipher AES-256-CBC
# Алгоритм аутентификации (хеш-функция для проверки целостности)
# SHA256 - стандартный, можно использовать bash-* из bee2evp
auth SHA256

# Сжатие
# Включает сжатие LZO для уменьшения трафика
# Можно отключить (удалить строку) или использовать comp-lzo adaptive для адаптивного сжатия
comp-lzo

# Keepalive
# Отправляет ping каждые 10 секунд, считает соединение разорванным после 120 секунд без ответа
# Помогает обнаруживать разрывы соединения и автоматически отключать неактивных клиентов
keepalive 10 120

# Логирование
# Уровень детализации логов (0-11, где 3 - нормальный, 4+ - отладка)
# В продакшене рекомендуется 3 или 4 для баланса между информативностью и размером логов
verb 3
# Подавляет повторяющиеся сообщения (последние 20 сообщений)
# Уменьшает засорение логов при проблемах с сетью
mute 20

# Безопасность
# Запуск от непривилегированного пользователя (раскомментируйте для безопасности)
# Требует запуска OpenVPN от root для создания TUN, затем переключения на nobody
# user nobody
# group nogroup
# Сохраняет ключи в памяти при переподключении (не перечитывает с диска)
# Улучшает безопасность, но требует, чтобы ключи были доступны при старте
persist-key
# Сохраняет TUN интерфейс при переподключении (не пересоздает)
# Ускоряет переподключение, но может вызвать проблемы при смене сетевых настроек
persist-tun

# Push маршруты клиентам
# Отправляет клиен там маршрут для доступа к VPN сети
# Можно добавить дополнительные маршруты: push "route 192.168.1.0 255.255.255.0"
push "route 10.8.0.0 255.255.255.0"

# Логи (комментируем, если директория не создана)
# Путь к файлу логов (раскомментируйте для сохранения логов на диск)
# log /var/log/openvpn/server.log
# Путь к файлу статуса соединения (раскомментируйте для мониторинга)
# status /var/log/openvpn/server-status.log