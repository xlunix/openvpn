# Конфигурация OpenVPN клиента с поддержкой bee2evp
# Этот файл определяет поведение OpenVPN клиента при подключении к серверу

# Режим работы
# Указывает, что это клиентское приложение (не сервер)
client
# Использует TLS для аутентификации (клиент должен предоставить сертификат)
tls-client

# Адрес сервера (IP адрес в Docker сети)
# В продакшене замените на реальный IP или доменное имя сервера
# Формат: remote <адрес> <порт> [протокол]
remote 10.10.0.1 1194
# Протокол передачи данных (UDP быстрее, TCP надежнее)
# Для продакшена можно использовать TCP (proto tcp) для большей надежности
proto udp

# TUN интерфейс
# Имя виртуального сетевого интерфейса для VPN туннеля
# Можно оставить автоматическое имя (dev tun) или указать конкретное
dev tun0
# Топология сети: subnet означает, что клиент получает IP из подсети сервера
# Альтернатива: net30 (устаревший) или p2p (point-to-point)
topology subnet

# Ключи и сертификаты
# Для тестирования: используем отпечаток сертификата вместо CA (для работы с самоподписанными сертификатами в OpenSSL 3.x)
# В продакшене используйте: ca /etc/openvpn/ca/ca.crt
peer-fingerprint 26:C8:04:3E:47:D2:E3:5C:D0:F7:A8:79:0C:57:11:47:42:A4:78:80:2B:DC:B4:2B:7A:6F:F3:8E:21:7A:72:63
# Сертификат клиента для аутентификации на сервере
cert /etc/openvpn/keys/client.crt
# Приватный ключ клиента (должен храниться в секрете)
key /etc/openvpn/keys/client.key
# TLS ключ для дополнительной защиты (опционально, раскомментируйте при использовании)
# tls-auth /etc/openvpn/keys/ta.key 1

# Криптография (используем bee2evp через OpenSSL)
# Алгоритм шифрования данных в туннеле
# AES-256-CBC - стандартный, но можно использовать алгоритмы bee2evp (belt-*)
cipher AES-256-CBC
# Алгоритм аутентификации (хеш-функция для проверки целостности)
# SHA256 - стандартный, можно использовать bash-* из bee2evp
auth SHA256

# Сжатие
# Включает сжатие LZO для уменьшения трафика
# Можно отключить (удалить строку) или использовать comp-lzo adaptive для адаптивного сжатия
comp-lzo

# Keepalive
# Отправляет ping каждые 10 секунд, считает соединение разорванным после 120 секунд без ответа
# Помогает обнаруживать разрывы соединения и автоматически переподключаться
keepalive 10 120

# Логирование
# Уровень детализации логов (0-11, где 3 - нормальный, 4+ - отладка)
# В продакшене рекомендуется 3 или 4 для баланса между информативностью и размером логов
verb 3
# Подавляет повторяющиеся сообщения (последние 20 сообщений)
# Уменьшает засорение логов при проблемах с сетью
mute 20

# Безопасность
# Сохраняет ключи в памяти при переподключении (не перечитывает с диска)
# Улучшает безопасность, но требует, чтобы ключи были доступны при старте
persist-key
# Сохраняет TUN интерфейс при переподключении (не пересоздает)
# Ускоряет переподключение, но может вызвать проблемы при смене сетевых настроек
persist-tun
# Не привязывается к конкретному локальному порту
# Позволяет клиенту работать за NAT и использовать любой доступный порт
nobind

# Логи (комментируем, если директория не создана)
# Путь к файлу логов (раскомментируйте для сохранения логов на диск)
# log /var/log/openvpn/client.log
# Путь к файлу статуса соединения (раскомментируйте для мониторинга)
# status /var/log/openvpn/client-status.log